name: Setup build environment
description: |
  Checkout the repo and optionally set up QEMU, Docker Buildx, and GHCR
  login. Replaces the inline setup ceremony that was repeated in every
  build-push.yml job.

inputs:
  with-qemu:
    description: Set up QEMU emulation (required for multi-arch Linux builds).
    default: 'false'
  with-buildx:
    description: Set up Docker Buildx (required for docker/build-push-action).
    default: 'false'
  with-login:
    description: Log into GHCR using GITHUB_TOKEN.
    default: 'false'
  fetch-depth:
    description: actions/checkout fetch-depth override (0 = full history).
    default: '1'

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - if: inputs.with-qemu == 'true'
      uses: docker/setup-qemu-action@v3

    - if: inputs.with-buildx == 'true'
      uses: docker/setup-buildx-action@v3

    - if: inputs.with-login == 'true'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
