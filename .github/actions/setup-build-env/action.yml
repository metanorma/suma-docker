name: Setup build environment
description: |
  Set up QEMU emulation, Docker Buildx, and GHCR login. Run this after
  actions/checkout — local composite actions need the repo checked out
  before they can be referenced via `uses: ./.github/actions/...`.

  Replaces the inline qemu/buildx/login ceremony that was repeated in
  every build-push.yml job.

inputs:
  with-qemu:
    description: Set up QEMU emulation (required for multi-arch Linux builds).
    default: 'false'
  with-buildx:
    description: Set up Docker Buildx (required for docker/build-push-action).
    default: 'false'
  with-login:
    description: Log into GHCR using GITHUB_TOKEN.
    default: 'false'

runs:
  using: composite
  steps:
    - if: inputs.with-qemu == 'true'
      uses: docker/setup-qemu-action@v4

    - if: inputs.with-buildx == 'true'
      uses: docker/setup-buildx-action@v4

    - if: inputs.with-login == 'true'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # github.token is the workflow's GITHUB_TOKEN; composite actions
        # cannot read secrets.* directly, so use the auto-issued token.
        password: ${{ github.token }}
