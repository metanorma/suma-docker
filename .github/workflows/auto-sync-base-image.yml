name: auto-sync-base-image

# Polls the latest metanorma-docker base-image tag and opens a PR bumping
# the pin when drift is detected. Runs daily off-peak, plus a manual
# trigger for force-sync.
#
# Auth: uses METANORMA_CI_PAT_TOKEN so the opened PR triggers downstream
# workflows (build-push validation). The default GITHUB_TOKEN would open
# the PR but no workflows would fire on it, defeating the point.
#
# Behaviour:
#   1. Read current base-image version from image-metadata.sh (which
#      parses Dockerfile FROM).
#   2. Fetch latest X.Y.Z tag from Docker Hub via
#      .github/scripts/latest-release.sh — Docker Hub is the canonical
#      source (metanorma-docker's GitHub Releases stopped being updated
#      in 2021).
#   3. Compare (sort -V); skip if current >= latest.
#   4. Skip if an open PR for the same bump already exists.
#   5. Otherwise: branch, bump Dockerfile + Dockerfile.windows + VERSION,
#      push, open PR.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
          fetch-depth: 0

      - name: Detect current base-image version
        id: current
        run: .github/scripts/image-metadata.sh >> "$GITHUB_OUTPUT"

      - name: Fetch latest metanorma-docker tag from Docker Hub
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(.github/scripts/latest-release.sh dockerhub:metanorma/metanorma)
          if [ -z "$LATEST" ]; then
            echo "Could not fetch latest tag from Docker Hub"
            exit 1
          fi
          echo "version=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.linux_base_version }}"
          LATEST="${{ steps.latest.outputs.version }}"
          echo "Current pin: ${CURRENT}"
          echo "Latest published: ${LATEST}"
          HIGHEST=$(printf '%s\n%s\n' "$CURRENT" "$LATEST" | sort -V | tail -1)
          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Up to date."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          elif [ "$HIGHEST" != "$LATEST" ]; then
            echo "Latest (${LATEST}) is older than current (${CURRENT}) — not downgrading."
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
          else
            echo "Drift detected."
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "new_version=${LATEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing open PR
        if: steps.compare.outputs.needs_sync == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="auto-sync/base-${{ steps.compare.outputs.new_version }}"
          COUNT=$(gh pr list --head "$BRANCH" --state open --json number -q 'length' 2>/dev/null || echo 0)
          echo "Open PRs on $BRANCH: $COUNT"
          if [ "$COUNT" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump files
        if: steps.compare.outputs.needs_sync == 'true' && steps.existing_pr.outputs.exists == 'false'
        run: |
          NEW="${{ steps.compare.outputs.new_version }}"
          # Linux base image
          sed -i "s|^FROM metanorma/metanorma:.*|FROM metanorma/metanorma:${NEW}|" Dockerfile
          # Windows base image — match any windows-ltscNNNN-<version>
          # pattern so a future ltsc2026 default doesn't silently no-op.
          sed -i -E "s|^(ARG BASE_IMAGE=metanorma/metanorma:windows-ltsc[0-9]+-)[0-9.]+|\1${NEW}|" Dockerfile.windows
          echo "${NEW}" > VERSION

      - name: Open pull request
        if: steps.compare.outputs.needs_sync == 'true' && steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
        run: |
          NEW="${{ steps.compare.outputs.new_version }}"
          CURRENT="${{ steps.current.outputs.linux_base_version }}"
          BRANCH="auto-sync/base-${NEW}"

          git checkout -b "$BRANCH"
          git config user.name "metanorma-ci"
          git config user.email "metanorma-ci@users.noreply.github.com"
          git add Dockerfile Dockerfile.windows VERSION
          git commit -m "Bump base image to metanorma ${NEW}"
          git push origin "$BRANCH"

          {
            echo "Detected that the base image has drifted from the latest metanorma-docker release."
            echo ""
            echo "- **Current pin:** \`${CURRENT}\`"
            echo "- **Latest published:** \`${NEW}\`"
            echo "- **Upstream tag:** https://hub.docker.com/v2/repositories/metanorma/metanorma/tags/"
            echo ""
            echo "This PR was opened automatically by the \`auto-sync-base-image\` workflow."
            echo "Review the upstream release notes (especially for major bumps) before merging."
            echo "After merge, run the \`release-tag\` workflow with \`next_version=${NEW}\` to publish."
          } > /tmp/pr-body.md

          gh pr create \
            --title "Bump base image to metanorma ${NEW}" \
            --body-file /tmp/pr-body.md \
            --head "$BRANCH"
