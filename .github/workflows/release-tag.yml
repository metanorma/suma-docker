# Manual version-bump workflow. Triggered via `gh workflow run release-tag.yml
# --ref main -f next_version=X.Y.Z` (or the Actions UI). Bumps VERSION, commits
# the change to main, tags v<next_version>, pushes. The tag push then triggers
# build-push.yml which publishes the multi-arch image to ghcr.io.
#
# The equivalent manual fallback (if this workflow isn't dispatchable for any
# reason) is:
#   echo "X.Y.Z" > VERSION && git commit -am "Bump version to X.Y.Z" \
#     && git tag vX.Y.Z && git push origin main --tags

name: release-tag

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next version (semver, e.g. 1.0.0)
        required: true

jobs:
  push-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

      - name: Validate semver
        run: |
          if [[ ! "${{ github.event.inputs.next_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be semver (e.g. 1.0.0)"
            exit 1
          fi

      - name: Update VERSION file
        run: |
          echo "${{ github.event.inputs.next_version }}" > VERSION

      - name: Push commit and tag
        run: |
          git config --global user.name "metanorma-ci"
          git config --global user.email "metanorma-ci@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${{ github.event.inputs.next_version }}"
          git tag v${{ github.event.inputs.next_version }}
          git push origin HEAD:${{ github.ref }} --tags
