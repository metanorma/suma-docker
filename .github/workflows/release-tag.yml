name: release-tag

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next version (semver, e.g. 1.0.0)
        required: true

jobs:
  push-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.METANORMA_CI_PAT_TOKEN }}

      - name: Validate semver
        run: |
          if [[ ! "${{ github.event.inputs.next_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be semver (e.g. 1.0.0)"
            exit 1
          fi

      - name: Update VERSION file
        run: |
          echo "${{ github.event.inputs.next_version }}" > VERSION

      - name: Push commit and tag
        run: |
          git config --global user.name "metanorma-ci"
          git config --global user.email "metanorma-ci@users.noreply.github.com"
          git add VERSION
          git commit -m "Bump version to ${{ github.event.inputs.next_version }}"
          git tag v${{ github.event.inputs.next_version }}
          git push origin HEAD:${{ github.ref }} --tags
