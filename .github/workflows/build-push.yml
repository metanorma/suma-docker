name: build-push

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'Dockerfile.windows'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'VERSION'
      - '.github/workflows/build-push.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.windows'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'VERSION'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  job_info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.result }}
      head_tag: ${{ steps.check.outputs.head_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "0.0.0")
          echo "result=${VERSION}" >> $GITHUB_OUTPUT
      - name: Show version
        run: echo ${{ steps.version.outputs.result }}
      - name: Retrieve tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/* || true
      - name: Set output variables
        id: check
        run: |
          tag=""
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            tag="$(git tag --points-at HEAD)"
          fi
          echo "head_tag=${tag}" >> $GITHUB_OUTPUT

  build-linux:
    name: Build (linux)
    runs-on: ubuntu-latest
    needs: job_info
    if: (github.event_name == 'push' && needs.job_info.outputs.head_tag == '') || github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and export
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: Dockerfile
          tags: suma:test
          outputs: type=docker,dest=/tmp/docker-image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: suma-linux-${{ github.run_id }}
          path: /tmp/docker-image.tar
          retention-days: 1

  build-windows:
    name: Build (windows)
    runs-on: ${{ matrix.root_image.os }}
    needs: job_info
    if: (github.event_name == 'push' && needs.job_info.outputs.head_tag == '') || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        root_image:
          - os: windows-2025
            id: ltsc2025
            base_image: metanorma/metanorma:windows-ltsc2025-1.15.7
          - os: windows-2022
            id: ltsc2022
            base_image: metanorma/metanorma:windows-ltsc2022-1.15.7

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build --pull --no-cache -t suma:windows-${{ matrix.root_image.id }} -f Dockerfile.windows --build-arg BASE_IMAGE=${{ matrix.root_image.base_image }} .
        shell: bash

      - name: Save image
        run: docker image save suma:windows-${{ matrix.root_image.id }} | gzip > docker-image.tar.gz
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: suma-windows-${{ matrix.root_image.id }}-${{ github.run_id }}
          path: docker-image.tar.gz
          retention-days: 1

  publish-linux:
    name: Publish (linux)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-linux
      - job_info

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/metanorma/suma-docker
          tags: |
            type=edge,branch=main
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.vendor=Ribose Inc.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=SUMA Docker image
            org.opencontainers.image.description=Docker container for SUMA and building ISO 10303 from source
            org.opencontainers.image.version=${{ needs.job_info.outputs.version }}

      - name: Build+push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-windows:
    name: Publish (windows-${{ matrix.root_image.id }})
    runs-on: ${{ matrix.root_image.os }}
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - job_info

    strategy:
      fail-fast: false
      matrix:
        root_image:
          - os: windows-2025
            id: ltsc2025
            base_image: metanorma/metanorma:windows-ltsc2025-1.15.7
          - os: windows-2022
            id: ltsc2022
            base_image: metanorma/metanorma:windows-ltsc2022-1.15.7

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag
        run: |
          docker build --pull --no-cache -t ghcr.io/metanorma/suma-docker:windows-${{ matrix.root_image.id }} -f Dockerfile.windows --build-arg BASE_IMAGE=${{ matrix.root_image.base_image }} .
        shell: bash

      - name: Push to GHCR
        run: docker push ghcr.io/metanorma/suma-docker:windows-${{ matrix.root_image.id }}
        shell: bash

  manifest-windows:
    name: Windows manifest
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: publish-windows

    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest
        uses: Noelware/docker-manifest-action@0.4.3
        with:
          inputs: ghcr.io/metanorma/suma-docker:windows
          images: ghcr.io/metanorma/suma-docker:windows-ltsc2022,ghcr.io/metanorma/suma-docker:windows-ltsc2025
          push: true
