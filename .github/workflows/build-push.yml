name: build-push

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'Dockerfile.windows'
      - 'VERSION'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/build-push.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'Dockerfile.windows'
      - 'VERSION'
      - 'tests/**'
      - '.github/scripts/**'
      - '.github/actions/**'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.job }}-${{ github.head_ref || github.ref_name }}'
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  job_info:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}
      major_minor: ${{ steps.version.outputs.major_minor }}
      major_minor_patch: ${{ steps.version.outputs.major_minor_patch }}
      head_tag: ${{ steps.check.outputs.head_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: .github/scripts/image-metadata.sh >> "$GITHUB_OUTPUT"
      - name: Smoke test the metadata script
        run: ./tests/test-image-metadata.sh
      - name: Retrieve tags
        run: git fetch --depth=1 origin +refs/tags/*:refs/tags/* || true
      - name: Set output variables
        id: check
        run: |
          tag=""
          if [[ "${{ github.ref }}" == refs/heads/* ]]; then
            tag="$(git tag --points-at HEAD)"
          fi
          echo "head_tag=${tag}" >> $GITHUB_OUTPUT

  publish-linux:
    name: Publish (linux)
    runs-on: ubuntu-latest
    needs: job_info
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          with-qemu: 'true'
          with-buildx: 'true'
          with-login: 'true'

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/metanorma/suma-docker
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.job_info.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.job_info.outputs.major_minor_patch }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.job_info.outputs.major_minor }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ needs.job_info.outputs.major }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.vendor=Ribose Inc.
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=SUMA Docker image
            org.opencontainers.image.description=Docker container for SUMA and building ISO 10303 from source
            org.opencontainers.image.version=${{ needs.job_info.outputs.version }}

      - name: Build for smoke test (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: Dockerfile
          load: true
          tags: suma:smoke-test

      - name: Smoke test
        run: ./tests/smoke.sh suma:smoke-test

      - name: Integration test (suma generate-schemas against iso-10303-smol)
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
        run: ./tests/integration.sh suma:smoke-test

      - name: Build+push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release-notes:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: publish-linux
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract image metadata
        id: meta
        run: |
          .github/scripts/image-metadata.sh >> "$GITHUB_OUTPUT"
          CUR_TAG="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git describe --abbrev=0 --tags "${CUR_TAG}^" 2>/dev/null || echo "")
          {
            echo "cur_tag=${CUR_TAG}"
            echo "prev_tag=${PREV_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Image metadata"
            echo ""
            echo "- **suma-docker version:** \`${{ steps.meta.outputs.version }}\`"
            echo "- **Base image:** \`${{ steps.meta.outputs.linux_base_image }}\`"
            echo "- **eengine:** \`${{ steps.meta.outputs.eengine_version }}\`"
            echo "- **eep:** latest from [\`expresslang/eep-releases\`](https://github.com/expresslang/eep-releases)"
            echo "- **Source commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})"
            echo "- **GHCR package:** https://github.com/${{ github.repository }}/pkgs/container/suma-docker"
            echo ""
            if [ -n "${{ steps.meta.outputs.prev_tag }}" ]; then
              echo "## Changes since \`${{ steps.meta.outputs.prev_tag }}\`"
              echo ""
              echo "https://github.com/${{ github.repository }}/compare/${{ steps.meta.outputs.prev_tag }}...${{ steps.meta.outputs.cur_tag }}"
            fi
          } > /tmp/release-notes.md
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md

  # Validation build (no push) — runs on PRs and main pushes.
  # main-push validation catches breakage introduced by merge even when no
  # tag follows, since `latest` only updates on tag push (see publish-linux).
  build-linux-pr:
    name: Validate build (linux)
    runs-on: ubuntu-latest
    needs: job_info
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          with-qemu: 'true'
          with-buildx: 'true'

      - name: Build (load to docker)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          file: Dockerfile
          tags: suma:test
          load: true

      - name: Smoke test
        run: ./tests/smoke.sh suma:test

      - name: Integration test (suma generate-schemas against iso-10303-smol)
        # Skip on PRs — the test does a full clone of iso-10303 (~3 min)
        # which is too long for routine PR feedback. Main pushes and tag
        # pushes still run it.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.METANORMA_CI_PAT_TOKEN }}
        run: ./tests/integration.sh suma:test

  publish-windows:
    name: Publish (windows-${{ matrix.root_image.id }})
    runs-on: ${{ matrix.root_image.os }}
    needs: job_info
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        root_image:
          - os: windows-2025
            id: ltsc2025
            base_image: metanorma/metanorma:windows-ltsc2025-1.16.8
          - os: windows-2022
            id: ltsc2022
            base_image: metanorma/metanorma:windows-ltsc2022-1.16.8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
        with:
          with-login: 'true'
      - name: Build and push
        run: |
          docker build --pull -t ghcr.io/metanorma/suma-docker:windows-${{ matrix.root_image.id }} -f Dockerfile.windows --build-arg BASE_IMAGE=${{ matrix.root_image.base_image }} .
          docker push ghcr.io/metanorma/suma-docker:windows-${{ matrix.root_image.id }}
        shell: bash
      - name: Smoke test
        shell: pwsh
        run: |
          $tag = "ghcr.io/metanorma/suma-docker:windows-${{ matrix.root_image.id }}"
          docker run --rm -v "$env:GITHUB_WORKSPACE\tests:C:\tests" $tag powershell -File C:\tests\smoke.ps1

  manifest-windows:
    name: Windows manifest
    runs-on: ubuntu-latest
    needs: publish-windows
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest
        uses: Noelware/docker-manifest-action@0.4.3
        with:
          inputs: ghcr.io/metanorma/suma-docker:windows
          images: ghcr.io/metanorma/suma-docker:windows-ltsc2022,ghcr.io/metanorma/suma-docker:windows-ltsc2025
          push: true

  build-windows-pr:
    name: Validate build (windows-${{ matrix.root_image.id }})
    runs-on: ${{ matrix.root_image.os }}
    needs: job_info
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        root_image:
          - os: windows-2025
            id: ltsc2025
            base_image: metanorma/metanorma:windows-ltsc2025-1.16.8
          - os: windows-2022
            id: ltsc2022
            base_image: metanorma/metanorma:windows-ltsc2022-1.16.8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-build-env
      - name: Build (no push)
        run: |
          docker build --pull -t suma:test -f Dockerfile.windows --build-arg BASE_IMAGE=${{ matrix.root_image.base_image }} .
        shell: bash
      - name: Smoke test
        shell: pwsh
        run: |
          docker run --rm -v "$env:GITHUB_WORKSPACE\tests:C:\tests" suma:test powershell -File C:\tests\smoke.ps1
