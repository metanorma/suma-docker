version: 2
updates:
  # Keep github-actions versions current (actions/checkout, docker/*-action, etc.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
      include: scope

  # NOTE: the `docker` ecosystem entry was removed. It competed with
  # auto-sync-base-image.yml — both watched for Dockerfile FROM bumps
  # and opened duplicate PRs (see PR #45 vs #46). The auto-sync workflow
  # is strictly better: it also bumps Dockerfile.windows + VERSION, runs
  # daily (vs weekly), and supports auto-merge.
